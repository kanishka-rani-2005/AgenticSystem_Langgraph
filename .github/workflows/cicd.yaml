name: ChatsGPT Docker Hub CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

    
concurrency:
  group: chatsgpt-production
  cancel-in-progress: true


permissions:
  contents: read
jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app.py agent.py rag.py tools.py database.py
      - name: Validate Docker build
        run: docker build --tag chatsgpt:ci .

  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Docker Hub settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          test -n "$DOCKER_USERNAME" || { echo "DOCKER_USERNAME is missing."; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo "DOCKER_PASSWORD is missing."; exit 1; }
          test -n "$IMAGE_NAME" || { echo "IMAGE_NAME is missing."; exit 1; }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  continuous_deployment:
    name: Deploy to EC2
    needs: push_to_registry
    runs-on: self-hosted
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes awscli
          fi
          aws --version
      - name: Verify deployment EC2 instance
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          test -n "$EC2_INSTANCE_ID" || { echo "EC2_INSTANCE_ID is missing."; exit 1; }
          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text | grep -qx "running"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Validate application secrets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          test -n "$GOOGLE_API_KEY" || { echo "GOOGLE_API_KEY is missing."; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "TAVILY_API_KEY is missing."; exit 1; }
      - name: Pull latest Docker image
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: docker pull "${IMAGE_PATH}:main"
      - name: Replace application container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          docker rm -f chatsgpt 2>/dev/null || true
          docker run -d \
            --name chatsgpt \
            --restart unless-stopped \
            -p 8080:8080 \
            -v chatsgpt-data:/app/data \
            -v chatsgpt-uploads:/app/uploads \
            -v chatsgpt-chroma:/app/chroma_db \
            -e GOOGLE_API_KEY \
            -e TAVILY_API_KEY \
            -e GEMINI_MODEL \
            -e LANGSMITH_TRACING \
            -e LANGSMITH_ENDPOINT \
            -e LANGSMITH_API_KEY \
            -e LANGSMITH_PROJECT \
            "${IMAGE_PATH}:main"
      - name: Verify application health
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              echo "ChatsGPT is healthy."
              exit 0
            fi
            echo "Waiting for ChatsGPT to become ready..."
            sleep 5
          done
          docker logs --tail 100 chatsgpt || true
          exit 1
      - name: Show recent application logs
        if: always()
        run: docker logs --tail 50 chatsgpt 2>/dev/null || true
      - name: Remove unused Docker images
        if: always()
        run: docker image prune -f
